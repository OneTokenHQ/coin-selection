name: package-publish

on:
  workflow_dispatch:

jobs:
  package-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Show versions
        run: |
          node -v
          npm -v
          yarn -v

      - name: Configure Yarn
        run: |
          yarn config set npmRegistryServer https://registry.npmjs.org
          yarn config set nodeLinker node-modules

      - name: Clean Yarn local cache artifacts
        run: |
          rm -rf .yarn/cache
          rm -rf .yarn/unplugged

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn run lint

      - name: Type Check
        run: yarn run type-check

      - name: Test
        run: yarn run test

      - name: Build
        run: yarn run build

      - name: Verify npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ASMJS_NPM_TOKEN }}
        run: npm whoami

      - name: Publish
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.ASMJS_NPM_TOKEN }}
        run: yarn npm publish --access public
